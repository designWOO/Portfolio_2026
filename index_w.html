<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finn Woo — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&family=Inter:wght@300;400;500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d50032; --red-deep:#a80028;
  --ink:#161616; --paper:#ffffff; --fog:#f6f4f2;
  --mist:#9a938d; --pink:#e27e93; --line:#e7e3df;
  --pink-1:#f3b9c6; --pink-2:#e27e93;
  --font-display:'Manrope','Noto Sans KR',sans-serif;
  --font-body:'Inter','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-weight:300;-webkit-font-smoothing:antialiased;
  overflow:hidden;overscroll-behavior:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
ul{list-style:none}
.font-display{font-family:var(--font-display);font-weight:300;letter-spacing:-.02em}
.label{font-family:var(--font-body);text-transform:uppercase;letter-spacing:.22em;
  font-size:11px;font-weight:500;color:var(--mist)}

/* ---------- Horizontal deck ---------- */
.deck{display:flex;height:100vh;width:400vw;
  transition:transform .85s cubic-bezier(.76,0,.24,1);will-change:transform}
.panel{width:100vw;height:100vh;flex:0 0 100vw;overflow-y:auto;overflow-x:hidden;
  padding:clamp(28px,7vh,88px) clamp(24px,6vw,110px);
  display:flex;flex-direction:column;justify-content:center}
.panel-inner{width:100%;max-width:1180px;margin:0 auto}

/* ---------- Intro ---------- */
#p-intro{background:var(--paper)}
.intro-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:clamp(32px,5vw,80px);align-items:center}
.logo-wrap{position:relative;width:min(74vw,420px);margin:0 auto}
.logo-wrap svg{width:100%;height:auto}
.mseg{fill:none;stroke:#fff;stroke-width:26px;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw linear forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.construction{opacity:0;animation:constructIn 1.8s .2s forwards}
@keyframes constructIn{to{opacity:1}}
.intro-copy .eyebrow{margin-bottom:26px}
.type-line{font-family:var(--font-display);font-weight:200;
  font-size:clamp(30px,5.4vw,66px);line-height:1.04;letter-spacing:-.03em;min-height:1.1em}
.type-name{color:var(--ink)}
.type-rotate{font-family:var(--font-display);font-weight:300;color:var(--red);
  font-size:clamp(22px,3.6vw,40px);line-height:1.2;margin-top:18px;min-height:1.3em;
  letter-spacing:-.02em}
.caret{display:inline-block;width:2px;height:.92em;background:var(--red);
  margin-left:4px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intro-roles{margin-top:40px;display:flex;flex-direction:column;gap:11px}
.intro-roles li{display:flex;align-items:baseline;gap:12px;font-size:15px;color:#3a3a3a}
.intro-roles .slash{color:var(--red);font-size:12px}
.sub-name{margin-top:14px;font-size:13px;color:var(--mist);letter-spacing:.02em}

/* ---------- Capabilities (Skills & Tools) ---------- */
#p-skills{background:var(--fog)}
.skills-head h2{font-family:var(--font-display);font-weight:300;
  font-size:clamp(30px,5vw,58px);letter-spacing:-.02em;margin-top:14px}
.thread-underline{margin-top:14px}
.thread-underline path{stroke:var(--red);stroke-width:6px;fill:none;stroke-linecap:round;
  stroke-dasharray:320;stroke-dashoffset:320;animation:threadDraw 1.2s .3s forwards}
@keyframes threadDraw{to{stroke-dashoffset:0}}
.skills-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(28px,4vw,56px);
  align-items:center;margin-top:clamp(28px,4vh,48px)}
.bubble-field{position:relative;height:clamp(360px,52vh,520px);user-select:none}
.bubble{text-align:center;mix-blend-mode:multiply;will-change:transform;cursor:default;
  border-radius:9999px;justify-content:center;align-items:center;line-height:1.25;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);display:flex;position:absolute;
  white-space:pre-line;font-weight:500}
.bubble:hover{transform:scale(1.08)!important}
@keyframes floatA{0%{transform:translate(0)}25%{transform:translate(10px,-16px)}50%{transform:translate(-6px,-26px)}75%{transform:translate(-14px,-8px)}to{transform:translate(0)}}
@keyframes floatB{0%{transform:translate(0)}30%{transform:translate(-12px,12px)}60%{transform:translate(8px,20px)}to{transform:translate(0)}}
@keyframes floatC{0%{transform:translate(0)}40%{transform:translate(14px,10px)}70%{transform:translate(4px,-14px)}to{transform:translate(0)}}
.float-a{animation:floatA 9s ease-in-out infinite}
.float-b{animation:floatB 11s ease-in-out infinite}
.float-c{animation:floatC 13s ease-in-out infinite}
.skills-list li{padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;
  display:flex;align-items:baseline;gap:14px}
.skills-list .slash{color:var(--red);font-size:12px}

/* ---------- Work ---------- */
#p-work{background:var(--paper);justify-content:flex-start;padding-top:clamp(66px,10vh,96px);padding-bottom:clamp(40px,8vh,80px)}
.work-eyebrow{margin-bottom:clamp(18px,3vh,30px)}
.wcat{padding:clamp(18px,3vh,30px) 0;border-top:1px solid var(--line)}
.wcat:last-child{border-bottom:1px solid var(--line)}
.wcat-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.wcat-num{font-size:12px;color:var(--red);font-family:var(--font-display);font-weight:500}
.wcat-title{font-family:var(--font-display);font-weight:400;
  font-size:clamp(18px,2.3vw,25px);letter-spacing:-.01em}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,18px)}
.ph-card{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:6px;
  background:var(--paper);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;cursor:pointer;color:var(--mist);
  transition:border-color .3s,background .3s,transform .3s,color .3s;
  font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
.ph-card:hover,.ph-card:focus-visible{border-color:var(--red);background:var(--fog);
  transform:translateY(-3px);color:var(--red);outline:none}
.ph-card .plus{font-size:24px;font-weight:200;line-height:1}
.ph-card .ph-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}

/* ---------- Contact ---------- */
#p-contact{background:var(--ink);color:#fff}
#p-contact .label{color:var(--pink)}
.contact-h{font-family:var(--font-display);font-weight:200;
  font-size:clamp(34px,7vw,84px);line-height:1.02;letter-spacing:-.03em;margin-top:22px}
.contact-h .dot{color:var(--red)}
.contact-btn{display:inline-flex;align-items:center;gap:12px;margin-top:44px;
  padding:15px 30px;border-radius:999px;background:var(--red);color:#fff;
  font-size:13px;letter-spacing:.04em;font-weight:500;transition:transform .3s,background .3s}
.contact-btn:hover{transform:translateY(-3px);background:var(--red-deep)}
.contact-foot{margin-top:clamp(40px,8vh,90px);padding-top:26px;
  border-top:1px solid #2c2c2c;display:flex;align-items:center;
  justify-content:space-between;gap:18px}
.contact-foot .label{color:#6f6f6f}

/* ---------- Nav arrows + dots ---------- */
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:40;
  width:52px;height:52px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:22px;color:var(--ink);transition:transform .3s,opacity .3s,background .3s;
  -webkit-tap-highlight-color:transparent}
.nav-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.06)}
.nav-arrow.left{left:22px}.nav-arrow.right{right:22px}
.nav-arrow[disabled]{opacity:.25;pointer-events:none}
.nav-arrow.on-dark{background:rgba(30,30,30,.6);border-color:#333;color:#fff}
.nav-arrow.on-dark:hover{background:rgba(50,50,50,.85)}

.dots{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;gap:22px;align-items:center;background:rgba(255,255,255,.82);
  backdrop-filter:blur(8px);padding:10px 20px;border-radius:999px;
  border:1px solid var(--line)}
.dot{border:0;background:none;cursor:pointer;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mist);font-family:var(--font-body);
  font-weight:500;transition:color .3s;-webkit-tap-highlight-color:transparent}
.dot.active{color:var(--red)}
.dots.on-dark{background:rgba(28,28,28,.7);border-color:#333}
.dots.on-dark .dot{color:#7d7d7d}
.dots.on-dark .dot.active{color:#fff}

/* mini brand mark top-left */
.brandmark{position:fixed;top:20px;left:22px;z-index:40;display:flex;
  align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500}
.brandmark img{width:26px;height:26px}
.brandmark.on-dark{color:#fff}

/* ---------- Work viewer overlay ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:var(--paper);
  overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .4s ease;
  padding:clamp(70px,10vh,110px) clamp(24px,6vw,120px) 80px}
.viewer.open{opacity:1;visibility:visible}
.back-to-list{position:fixed;top:22px;left:22px;z-index:70;display:inline-flex;
  align-items:center;gap:9px;padding:11px 20px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
  cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:500;color:var(--ink);font-family:var(--font-body);
  transition:transform .3s,background .3s;-webkit-tap-highlight-color:transparent}
.back-to-list:hover{transform:translateX(-3px);background:#fff}
.viewer-inner{max-width:1120px;margin:0 auto}
.viewer-cat{color:var(--red)}
.viewer-title{font-family:var(--font-display);font-weight:300;
  font-size:clamp(28px,5vw,54px);letter-spacing:-.02em;margin-top:12px;line-height:1.05}
.viewer-client{margin-top:12px;color:var(--mist);font-size:15px}
.viewer-desc{margin-top:20px;max-width:640px;font-size:16px;line-height:1.7;color:#333}
.viewer-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.viewer-tags span{font-size:11px;letter-spacing:.06em;padding:7px 14px;border-radius:999px;
  border:1px solid var(--line);color:#555;background:var(--fog)}
.viewer-link{display:inline-flex;align-items:center;gap:7px;margin-top:22px;
  color:var(--red);font-size:13px;letter-spacing:.05em;font-weight:500}
.viewer-media{margin-top:clamp(32px,5vh,56px);display:grid;
  grid-template-columns:repeat(2,1fr);gap:clamp(12px,2vw,22px)}
.viewer-media figure{margin:0;border:1px solid var(--line);border-radius:3px;
  overflow:hidden;background:var(--fog)}
.viewer-media figure.wide{grid-column:1 / -1}
.viewer-media img{width:100%;height:auto}
.slot-big{aspect-ratio:16/8;border:1.5px dashed var(--line)!important;background:var(--fog);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  color:var(--mist)}
.slot-big .plus{font-size:40px;font-weight:200;line-height:1}
.slot-big .ph-label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.viewer-note{margin-top:40px;padding:28px 30px;border-radius:6px;background:var(--fog);
  border:1px solid var(--line);max-width:640px;font-size:15px;line-height:1.7;color:#444}
.viewer-note strong{color:var(--red);font-weight:600}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .intro-grid{grid-template-columns:1fr;text-align:center}
  .logo-wrap{width:min(64vw,300px)}
  .intro-roles{align-items:center}
  .intro-roles li{justify-content:center}
  .about-cols{grid-template-columns:1fr;gap:8px}
  .viewer-media{grid-template-columns:1fr}
  .viewer-media figure.wide{grid-column:auto}
  .nav-arrow{width:44px;height:44px;font-size:19px}
  .nav-arrow.left{left:12px}.nav-arrow.right{right:12px}
  .dots{gap:14px;padding:9px 15px}
  .dot{font-size:10px;letter-spacing:.1em}
  .work-item .meta{display:none}
  .panel{justify-content:flex-start;padding-top:60px}
  /* 버블/목록을 좌우 반반 → 위/아래로 */
  .skills-grid{grid-template-columns:1fr;gap:24px}

  /* 버블 영역은 작게, 하지만 둥둥 뜨는 느낌은 유지 */
  /* .bubble-field{height:clamp(220px,38vh,300px)} */
  .bubble{transform:scale(.5);transform-origin:center}
  .bubble:hover{transform:scale(.56)!important}
    /* 모바일 전용 — 특정 버블 위치 재지정 */
  .bubble-field .b6{ left:30% !important; top:80% !important; }  /* Framework */
  .bubble-field .b7{ top:80% !important; }                       /* Javascript */
}
@media (prefers-reduced-motion:reduce){
  .deck{transition-duration:.25s}
  .mseg{animation-duration:.4s!important;animation-delay:0s!important}
  .construction{animation-duration:.4s!important}
  .caret{animation:none}
}

.logo-stack{position:relative;width:100%}
.logo-line,.logo-fill{width:100%;height:auto;display:block}
.logo-line{position:absolute;top:50%;left:0;transform:translateY(-50%);opacity:0;animation:constructIn 1.6s .2s forwards}
@keyframes constructIn{to{opacity:.55}}
.logo-fill{position:relative}
.logo-fill path{fill:none;stroke:#db0032;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes logoDraw{
  0%   { stroke-dashoffset: var(--len); opacity: 1; }
  50%  { stroke-dashoffset: 0;          opacity: 1; }   /* 다 그려짐 */
  85%  { stroke-dashoffset: 0;          opacity: 1; }   /* 함께 보여줌 */
  86%  { stroke-dashoffset: 0;          opacity: 0; }   /* 함께 톡 사라짐 */
  87%  { stroke-dashoffset: var(--len); opacity: 0; }   /* 함께 백지 리셋 */
  100% { stroke-dashoffset: var(--len); opacity: 0; }
}
</style>
</head>
<body>

<!-- <div class="brandmark" id="brandmark"><img id="brandmark-logo" alt="Finn Woo logo"><span>Finn Woo</span></div> -->

<div class="deck" id="deck">

  <!-- INTRO -->
  <section class="panel" id="p-intro">
    <div class="panel-inner">
      <div class="intro-grid">
        <div class="logo-wrap" id="logoWrap" aria-hidden="true"></div>
        <div class="intro-copy">
          <!-- <p class="label eyebrow">Portfolio — 01</p> -->
          <div class="type-line"><span class="type-name" id="typeName"></span><span class="caret" id="caret1"></span></div>
          <div class="type-rotate"><span id="typeRotate"></span><span class="caret" id="caret2" style="visibility:hidden"></span></div>
          <p class="sub-name">Graphic &amp; Digital Content Designer</p>
          <ul class="intro-roles">
            <li><span class="slash">/</span>Graphic &amp; brand design</li>
            <li><span class="slash">/</span>Web design &amp; site management</li>
            <li><span class="slash">/</span>Social &amp; digital content</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- CAPABILITIES / SKILLS & TOOLS -->
  <section class="panel" id="p-skills">
    <div class="panel-inner">
      <div class="skills-head">
        <!-- <p class="label">02 — Capabilities</p> -->
        <h2>Skills &amp; Tools</h2>
        <svg class="thread-underline" viewBox="0 0 320 24" width="180" height="14"><path d="M4 12 L316 12"/></svg>
      </div>
      <div class="skills-grid">
        <div class="bubble-field" id="bubbleField" aria-hidden="true"></div>
        <ul class="skills-list" id="skillsList"></ul>
      </div>
    </div>
  </section>

  <!-- WORK -->
  <section class="panel" id="p-work">
    <div class="panel-inner">
      <div class="skills-head">
        <!-- <p class="label work-eyebrow">03 — Work</p> -->
        <h2>Work</h2>
        <svg class="thread-underline" viewBox="0 0 320 24" width="180" height="14"><path d="M4 12 L316 12"/></svg>
      </div>
      <div id="workList"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="panel" id="p-contact">
    <div class="panel-inner">
      <!-- <p class="label">Contact — 04</p> -->
      <h2 class="contact-h">I look forward<br>to meeting you<span class="dot">.</span></h2>
      <a class="contact-btn" href="mailto:woojooinnet@gmail.com">woojooinnet@gmail.com <span>↗</span></a>
      <div class="contact-foot">
        <img id="footer-logo" alt="Finn Woo logo" style="width:52px;height:52px">
        <p class="label" id="copyline"></p>
      </div>
    </div>
  </section>

</div>

<button class="nav-arrow left" id="arrowL" aria-label="Previous section">‹</button>
<button class="nav-arrow right" id="arrowR" aria-label="Next section">›</button>

<nav class="dots" id="dots" aria-label="Section navigation"></nav>

<!-- WORK VIEWER -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Project detail">
  <button class="back-to-list" id="backBtn">‹ Back to list</button>
  <div class="viewer-inner" id="viewerInner"></div>
</div>

    o.p.style.strokeDashoffset = 0;
  }
  function cycle(){
    blank();
    void target.offsetWidth;   // 초기 백지 상태 강제 반영
    info.forEach((o,i)=> setTimeout(()=>drawOne(o), i*DRAW*1000));
    const allDrawn = info.length * DRAW * 1000;
    setTimeout(()=>{           // 다 그려진 뒤 함께 사라짐
      info.forEach(o=>{ o.p.style.transition = 'opacity .18s ease'; o.p.style.opacity = 0; });
    }, allDrawn + HOLD*1000);
    setTimeout(cycle, allDrawn + HOLD*1000 + 180 + GAP*1000);   // 다음 바퀴
  }
  cycle();
}
  buildLogo(document.getElementById('logoWrap'), true);
  //document.getElementById('brandmark-logo').src = A.f;
  document.getElementById('footer-logo').src = A.f;
  document.getElementById('copyline').textContent = '© ' + new Date().getFullYear() + ' Finn Woo — All rights reserved';

  /* ---- Typing intro ---- */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nameEl = document.getElementById('typeName');
  const rotEl  = document.getElementById('typeRotate');
  const caret1 = document.getElementById('caret1');
  const caret2 = document.getElementById('caret2');
  const NAME = "Hi, I'm Finn Woo.";
  const PHRASES = ["I design ideas.", "I craft content that connects.", "I turn stories into visuals."];

  function typeName(cb){
    let i=0;
    (function step(){
      nameEl.textContent = NAME.slice(0,i);
      if(i<=NAME.length){ i++; setTimeout(step, 55); }
      else cb();
    })();
  }
  function rotate(){
    caret1.style.visibility='hidden';
    caret2.style.visibility='visible';
    let p=0;
    function typePhrase(){
      const txt=PHRASES[p]; let i=0;
      (function ins(){
        rotEl.textContent=txt.slice(0,i);
        if(i<=txt.length){ i++; setTimeout(ins,48); }
        else setTimeout(delPhrase, 1900);
      })();
    }
    function delPhrase(){
      const txt=PHRASES[p]; let i=txt.length;
      (function del(){
        rotEl.textContent=txt.slice(0,i);
        if(i>=0){ i--; setTimeout(del,26); }
        else { p=(p+1)%PHRASES.length; setTimeout(typePhrase,180); }
      })();
    }
    typePhrase();
  }
  if(reduce){
    nameEl.textContent=NAME; rotEl.textContent=PHRASES[0];
    caret1.style.visibility='hidden';
  }else{
    setTimeout(()=>typeName(()=>{caret1.style.visibility='hidden';rotate();}), 900);
  }

  /* ---- Skills & Tools (Capabilities) ---- */
  const BUBBLES = [
    {label:"PhotoShop\nIllustrator",size:190,x:"22%",y:"18%",bg:"var(--red)",color:"#fff",cls:"float-a",z:3},
    {label:"HTML\nCSS",size:185,x:"40%",y:"44%",bg:"var(--ink)",color:"#fff",cls:"float-b",z:4},
    {label:"Adobe XD\nFigma",size:120,x:"43%",y:"6%",bg:"var(--pink-2)",color:"#fff",cls:"float-c",z:2},
    {label:"InDesign",size:112,x:"8%",y:"48%",bg:"var(--pink-2)",color:"#fff",cls:"float-b",z:2},
    {label:"SCSS\nLESS",size:104,x:"66%",y:"38%",bg:"#6E6A66",color:"#fff",cls:"float-a",z:2},
    {label:"Sketch\nInVision",size:92,x:"6%",y:"8%",bg:"var(--pink-1)",color:"#fff",cls:"float-c",z:1},
    {label:"Framework",size:96,x:"58%",y:"74%",bg:"#8B8781",color:"#fff",cls:"float-c",z:2},
    {label:"Javascript",size:86,x:"78%",y:"62%",bg:"#C9C4BE",color:"#fff",cls:"float-b",z:1},
  ];
  const SKILLS = [
    "Graphic Design (Printing / Web / Brand)","UI/UX Design Prototyping",
    "HTML5, CSS3, SCSS, LESS","Responsive Web","Web Accessibility & W3C Standards",
    "PhotoShop, Illustrator, InDesign","Adobe XD, Figma, Sketch, InVision",
    "VS Code, WordPress, Bootstrap"
  ];
  const bf=document.getElementById('bubbleField');
  BUBBLES.forEach((b,i)=>{
    const d=document.createElement('div');
    d.className='bubble '+b.cls+' b'+i;
    d.style.cssText=`width:${b.size}px;height:${b.size}px;left:${b.x};top:${b.y};`+
      `background:${b.bg};color:${b.color};z-index:${b.z};`+
      `font-size:${b.size>150?17:13}px;animation-delay:${(b.size%7)*0.4}s`;
    d.textContent=b.label;
    bf.appendChild(d);
  });
  const sl=document.getElementById('skillsList');
  SKILLS.forEach(s=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="slash">/</span>${s}`;
    sl.appendChild(li);
  });

  /* ---- Work: categories + empty image slots (fill later) ---- */
  const WORK = [
    { cat:"Graphic Design — Illustration & Photoshop", slots:3 },
    { cat:"Homepage Design & Management",               slots:3 },
    { cat:"Social Media Management",                    slots:3 },
    { cat:"Technical Document Design",                  slots:3 },
  ];

  const listEl = document.getElementById('workList');
  WORK.forEach((c,ci)=>{
    const cat=document.createElement('div'); cat.className='wcat';
    cat.innerHTML=`<div class="wcat-head"><span class="wcat-num">0${ci+1}</span>`+
      `<span class="wcat-title">${c.cat}</span></div>`;
    const grid=document.createElement('div'); grid.className='ph-grid';
    for(let i=0;i<c.slots;i++){
      const card=document.createElement('button');
      card.className='ph-card'; card.type='button';
      card.setAttribute('aria-label',`${c.cat} — image slot ${i+1}`);
      card.innerHTML=`<span class="plus">+</span><span class="ph-label">Image ${String(i+1).padStart(2,'0')}</span>`;
      card.addEventListener('click',()=>openViewer(c.cat, i+1));
      grid.appendChild(card);
    }
    cat.appendChild(grid);
    listEl.appendChild(cat);
  });

  /* ---- Fullscreen slot viewer (placeholder) ---- */
  const viewer=document.getElementById('viewer');
  const viewerInner=document.getElementById('viewerInner');
  const backBtn=document.getElementById('backBtn');
  let viewerOpen=false;
  function openViewer(catName, n){
    viewerInner.innerHTML=
      `<p class="label viewer-cat">${catName}</p>
       <h2 class="viewer-title">Image ${String(n).padStart(2,'0')}</h2>
       <div class="viewer-media"><figure class="wide slot-big">
         <span class="plus">+</span>
         <span class="ph-label">Drop artwork here</span>
       </figure></div>
       <div class="viewer-note">Empty slot — <strong>replace with your new image and add a title &amp; description.</strong> This is where a full-screen view of the selected work will appear.</div>`;
    viewer.scrollTop=0;
    viewer.classList.add('open');
    viewerOpen=true; updateArrows(); backBtn.focus();
  }
  function closeViewer(){ viewer.classList.remove('open'); viewerOpen=false; updateArrows(); }
  backBtn.addEventListener('click',closeViewer);

  /* ---- Horizontal paging ---- */
  const deck=document.getElementById('deck');
  const panels=[...document.querySelectorAll('.panel')];
  const N=panels.length;
  const NAMES=['Intro','Skills','Work','Contact'];
  const DARK=[false,false,false,true];
  let idx=0;
  const arrowL=document.getElementById('arrowL');
  const arrowR=document.getElementById('arrowR');
  const dotsEl=document.getElementById('dots');
  //const brandmark=document.getElementById('brandmark');

  NAMES.forEach((n,i)=>{
    const b=document.createElement('button');
    b.className='dot'+(i===0?' active':''); b.textContent=n;
    b.addEventListener('click',()=>go(i));
    dotsEl.appendChild(b);
  });
  const dotBtns=[...dotsEl.children];

  function go(i){
    if(viewerOpen) return;
    idx=Math.max(0,Math.min(N-1,i));
    deck.style.transform=`translateX(-${idx*100}vw)`;
    dotBtns.forEach((d,k)=>d.classList.toggle('active',k===idx));
    applyTheme();
    updateArrows();
  }
  function applyTheme(){
    const dark=DARK[idx];
    arrowL?.classList.toggle('on-dark',dark);
    arrowR?.classList.toggle('on-dark',dark);
    dotsEl?.classList.toggle('on-dark',dark);
  }
  function updateArrows(){
    if(viewerOpen){ arrowL.setAttribute('disabled','');arrowR.setAttribute('disabled',''); return; }
    arrowL.toggleAttribute('disabled', idx===0);
    arrowR.toggleAttribute('disabled', idx===N-1);
  }
  arrowL.addEventListener('click',()=>go(idx-1));
  arrowR.addEventListener('click',()=>go(idx+1));

  /* keyboard */
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&viewerOpen){ closeViewer(); return; }
    if(viewerOpen) return;
    if(e.key==='ArrowRight') go(idx+1);
    else if(e.key==='ArrowLeft') go(idx-1);
  });

  /* touch swipe */
  let tsx=0,tsy=0;
  window.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
  window.addEventListener('touchend',e=>{
    if(viewerOpen) return;
    const dx=e.changedTouches[0].clientX-tsx;
    const dy=e.changedTouches[0].clientY-tsy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4){
      if(dx<0) go(idx+1); else go(idx-1);
    }
  },{passive:true});

  updateArrows();
})();
</script>
</body>
</html>
